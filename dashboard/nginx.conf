# ═══════════════════════════════════════════════════════════════
#  Nginx: serve dashboard + proxy API to backend on host machine
#  Backend runs natively (not in Docker) for camera access
# ═══════════════════════════════════════════════════════════════

upstream backend {
    # host.docker.internal = the host machine running the Flask backend
    server host.docker.internal:5000;
}

server {
    listen 80;
    server_name _;

    # ── Dashboard (React SPA) ─────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API reverse proxy → Flask backend on host ─────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50M;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Video feed (MJPEG — needs long timeout) ───────────────
    location /video_feed {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # ── Other backend routes ──────────────────────────────────
    location ~ ^/(health|status|stats|config|events|users|enroll|set_reference|activity_status|camera) {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50M;
        proxy_read_timeout 60s;
    }

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
