# ═══════════════════════════════════════════════════════════════
#  Nginx: serve dashboard + proxy API to backend on host machine
#  Backend runs natively (not in Docker) for camera access
# ═══════════════════════════════════════════════════════════════

upstream backend {
    # host.docker.internal = the host machine running the Flask backend
    server host.docker.internal:5000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Long-lived streams: live events (SSE) and MJPEG camera feeds ──
    # Buffering must be off or updates arrive in bursts / never.
    location ~ ^/(api/stream|api/cameras/[^/]+/feed|video_feed)$ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # ── API ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50M;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Original un-prefixed backend routes (for external clients) ──
    # /events and /cameras are dashboard pages, so they are deliberately not proxied here.
    location ~ ^/((health|status|stats|config|users|enroll|activity_status)$|camera/) {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50M;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
